<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIP Choice Service — Downloadable Story/Reel Ad (9:16)</title>
<style>
  :root{--gold:#d4af37;--paper:#f7f5ef;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:20px;padding:32px 16px;color:var(--paper);
    background:
      radial-gradient(1100px 600px at 80% -10%,#1c2230 0,transparent 60%),
      radial-gradient(900px 500px at 10% 110%,#20180a 0,transparent 55%),
      linear-gradient(160deg,#070a0f 0%,#0d1117 55%,#11151c 100%);
  }
  .headline{text-align:center;max-width:560px}
  .headline h1{font-size:clamp(20px,4vw,28px);font-weight:700}
  .headline h1 span{color:var(--gold)}
  .headline p{margin-top:6px;color:#9aa4b2;font-size:13px}
  canvas{
    width:300px;max-width:80vw;height:auto;border-radius:18px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.8),0 0 0 1px rgba(212,175,55,.25);
  }
  .btn{cursor:pointer;border:none;font-weight:800;font-size:15px;padding:13px 26px;
    border-radius:999px;background:var(--gold);color:#0d1117;
    box-shadow:0 10px 28px -6px rgba(212,175,55,.6)}
  .note{color:#5d6675;font-size:12px;text-align:center;max-width:460px;line-height:1.5}
  .note code{color:#9aa4b2}
</style>
</head>
<body>
  <div class="headline">
    <h1><span>VIP Choice Service</span> — Story/Reel Ad (1080×1920)</h1>
    <p>Download the PNG and upload as a static Stories or Reels ad</p>
  </div>

  <canvas id="ad" width="1080" height="1920" aria-label="VIP Choice Service story ad"></canvas>
  <button id="download" class="btn">⬇ Download PNG</button>

  <p class="note">
    Real 1080×1920 image — Facebook/Instagram Stories &amp; Reels size. Edit the
    <code>CONFIG</code> block in this file's script to change text, then re-download.
  </p>

<script>
const CONFIG = {
  business:"VIP Choice Service", badge:"VIP", location:"Dallas, TX",
  kicker:"DALLAS, TX",
  headline:[{t:"Stop ",gold:false},{t:"overpaying",gold:true},{t:" the IRS.",gold:false}],
  sub:"Most people leave money on the table every year. You don't have to.",
  services:["💸 Tax Prep","📚 Bookkeeping","🖊️ Notary","🚀 LLC Setup"],
  offer:"FREE 15-minute consult", offerSub:"Limited spots this month",
  cta:"Book Now · Dallas, TX", gold:"#d4af37"
};
const cv=document.getElementById('ad'), x=cv.getContext('2d');
const W=1080,H=1920,PAD=90;
function rr(g,rx,ry,rw,rh,r){g.beginPath();g.moveTo(rx+r,ry);
  g.arcTo(rx+rw,ry,rx+rw,ry+rh,r);g.arcTo(rx+rw,ry+rh,rx,ry+rh,r);
  g.arcTo(rx,ry+rh,rx,ry,r);g.arcTo(rx,ry,rx+rw,ry,r);g.closePath();}

function draw(){
  const bg=x.createLinearGradient(0,0,W*0.4,H);
  bg.addColorStop(0,"#13233f");bg.addColorStop(0.55,"#0a1322");bg.addColorStop(1,"#0d0a04");
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  const glow=x.createRadialGradient(W-140,160,0,W-140,160,520);
  glow.addColorStop(0,"rgba(212,175,55,0.22)");glow.addColorStop(1,"rgba(212,175,55,0)");
  x.fillStyle=glow;x.fillRect(0,0,W,H);

  // brand row
  const avX=PAD,avY=PAD,avR=50;
  const ag=x.createLinearGradient(avX,avY,avX+avR*2,avY+avR*2);
  ag.addColorStop(0,CONFIG.gold);ag.addColorStop(1,"#8a6d12");
  x.beginPath();x.arc(avX+avR,avY+avR,avR,0,Math.PI*2);x.fillStyle=ag;x.fill();
  x.fillStyle="#0d1117";x.font="800 32px Segoe UI, Arial";
  x.textAlign="center";x.textBaseline="middle";x.fillText(CONFIG.badge,avX+avR,avY+avR+1);
  x.textAlign="left";x.textBaseline="alphabetic";
  x.fillStyle="#f7f5ef";x.font="700 38px Segoe UI, Arial";
  x.fillText(CONFIG.business,avX+avR*2+26,avY+44);
  x.fillStyle="#9aa4b2";x.font="400 27px Segoe UI, Arial";
  x.fillText("Sponsored · "+CONFIG.location,avX+avR*2+26,avY+84);

  // kicker
  let cy=560;
  x.fillStyle="#f1d77a";x.font="700 32px Segoe UI, Arial";
  if(x.letterSpacing!==undefined)x.letterSpacing="6px";
  x.fillText(CONFIG.kicker,PAD,cy);
  if(x.letterSpacing!==undefined)x.letterSpacing="0px";

  // headline
  x.font="900 112px Segoe UI, Arial";
  const maxW=W-PAD*2,lineH=116;
  let tokens=[];
  CONFIG.headline.forEach(s=>s.t.split(/(\s+)/).forEach(w=>{if(w.length)tokens.push({t:w,gold:s.gold});}));
  let line=[],lines=[],lw=0;
  tokens.forEach(tok=>{const w=x.measureText(tok.t).width;
    if(lw+w>maxW&&line.length){lines.push(line);line=[];lw=0;}line.push(tok);lw+=w;});
  if(line.length)lines.push(line);
  let hy=cy+110;
  lines.forEach(ln=>{let lx=PAD;ln.forEach(tok=>{x.fillStyle=tok.gold?CONFIG.gold:"#fff";
    x.fillText(tok.t,lx,hy);lx+=x.measureText(tok.t).width;});hy+=lineH;});

  // sub
  x.fillStyle="#ece8dc";x.font="400 40px Segoe UI, Arial";
  let sy=hy+14;const words=CONFIG.sub.split(" ");let l="";
  words.forEach(wd=>{const t=l?l+" "+wd:wd;
    if(x.measureText(t).width>maxW&&l){x.fillText(l,PAD,sy);l=wd;sy+=54;}else l=t;});
  if(l)x.fillText(l,PAD,sy);

  // service pills (stacked, two columns)
  let py=sy+80;x.font="600 34px Segoe UI, Arial";
  let px=PAD;
  CONFIG.services.forEach(s=>{const tw=x.measureText(s).width,pw=tw+56,ph=70;
    if(px+pw>W-PAD){px=PAD;py+=ph+20;}
    rr(x,px,py,pw,ph,ph/2);x.fillStyle="rgba(255,255,255,0.08)";x.fill();
    x.lineWidth=2;x.strokeStyle="rgba(212,175,55,0.5)";x.stroke();
    x.fillStyle="#f3efe2";x.textBaseline="middle";x.fillText(s,px+28,py+ph/2+1);
    x.textBaseline="alphabetic";px+=pw+18;});

  // offer block
  x.textAlign="center";
  x.fillStyle="#f3efe2";x.font="700 46px Segoe UI, Arial";
  x.fillText("🟡 "+CONFIG.offer,W/2,H-440);
  x.fillStyle="#9aa4b2";x.font="400 30px Segoe UI, Arial";
  x.fillText(CONFIG.offerSub,W/2,H-388);

  // CTA pill (centered, wide)
  x.font="800 42px Segoe UI, Arial";
  const ctw=x.measureText(CONFIG.cta).width,cpw=Math.min(W-PAD*2,ctw+120),cph=104;
  const cpx=(W-cpw)/2,cpy=H-300;
  rr(x,cpx,cpy,cpw,cph,cph/2);x.fillStyle=CONFIG.gold;x.fill();
  x.fillStyle="#0d1117";x.textBaseline="middle";
  x.fillText(CONFIG.cta,W/2,cpy+cph/2+1);
  x.textAlign="left";x.textBaseline="alphabetic";
}
draw();
document.getElementById('download').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='vip-choice-story-ad-1080x1920.png';
  a.href=cv.toDataURL('image/png');a.click();
});
</script>
</body>
</html>
